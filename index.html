<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ParentPal</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👶</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root {
  --bg: #fdf8f6; --surface: #ffffff; --surface-2: #fbf1ee; --text: #2b2236; --muted: #776d82;
  --border: #eedfdc; --pink: #ec6fa3; --pink-soft: #fde4ef; --violet: #8b6cf0; --violet-soft: #ece6ff;
  --blue: #4f9de8; --blue-soft: #e2f0fd; --green: #2fae7e; --green-soft: #ddf5ea;
  --amber: #e8a33a; --amber-soft: #fdf1dc; --red: #e2475b; --red-soft: #fde5e8;
  --shadow: 0 1px 2px rgba(60,30,60,.05), 0 8px 24px rgba(60,30,60,.07);
  --radius: 20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17131d; --surface: #211b29; --surface-2: #2a2333; --text: #f3eef8; --muted: #a99fb5;
    --border: #3a3045; --pink-soft: #43203a; --violet-soft: #2f2650; --blue-soft: #1c3047;
    --green-soft: #173a2e; --amber-soft: #43331a; --red-soft: #4a1f27;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --bg: #17131d; --surface: #211b29; --surface-2: #2a2333; --text: #f3eef8; --muted: #a99fb5;
  --border: #3a3045; --pink-soft: #43203a; --violet-soft: #2f2650; --blue-soft: #1c3047;
  --green-soft: #173a2e; --amber-soft: #43331a; --red-soft: #4a1f27;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: Nunito, system-ui, sans-serif;
       -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--violet); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 64px; }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(10px);
       background: color-mix(in srgb, var(--bg) 82%, transparent); border-bottom: 1px solid var(--border); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-top: 12px; padding-bottom: 12px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.25rem; }
.logo-mark { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 1.3rem;
             background: linear-gradient(135deg, var(--pink), var(--violet)); }
.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 999px; margin-left: 8px; }
.tab { border: 0; background: none; padding: 7px 14px; border-radius: 999px; cursor: pointer; font-weight: 700; color: var(--muted); }
.tab.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.spacer { flex: 1; }
.chip-btn { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--surface);
            border-radius: 999px; padding: 6px 12px 6px 6px; cursor: pointer; font-weight: 700; }
.chip-btn .av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
                background: var(--pink-soft); }
.icon-btn { border: 1px solid var(--border); background: var(--surface); width: 38px; height: 38px;
            border-radius: 50%; cursor: pointer; }

/* hero + ask */
.hero { text-align: center; padding: 40px 0 18px; }
.hero h1 { font-size: clamp(1.7rem, 4vw, 2.6rem); margin: 0 0 6px; letter-spacing: -.02em; }
.hero h1 span { background: linear-gradient(90deg, var(--pink), var(--violet), var(--blue));
                -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { color: var(--muted); margin: 0; }
.ask { max-width: 760px; margin: 22px auto 0; background: var(--surface); border: 1px solid var(--border);
       border-radius: 24px; box-shadow: var(--shadow); padding: 10px 10px 10px 18px; display: flex; gap: 10px; align-items: flex-end; }
.ask textarea { flex: 1; border: 0; outline: 0; background: none; resize: none; font-size: 1.05rem;
                padding: 10px 0; min-height: 26px; max-height: 160px; }
.send { border: 0; border-radius: 16px; padding: 12px 20px; font-weight: 800; color: #fff; cursor: pointer;
        background: linear-gradient(135deg, var(--pink), var(--violet)); white-space: nowrap; }
.send:disabled { opacity: .55; cursor: not-allowed; }
.samples { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 14px auto 0; max-width: 820px; }
.sample { border: 1px solid var(--border); background: var(--surface); padding: 7px 14px; border-radius: 999px;
          cursor: pointer; color: var(--muted); font-weight: 600; }
.sample:hover { color: var(--text); border-color: var(--violet); }
.context-line { text-align: center; color: var(--muted); font-size: .88rem; margin-top: 12px; }

/* pipeline */
.pipeline { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 28px 0 10px; position: relative; }
.node { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 14px 16px;
        display: flex; gap: 12px; align-items: center; transition: all .3s; }
.node .ic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 1.35rem;
            background: var(--surface-2); flex: none; }
.node .nm { font-weight: 800; } .node .ds { font-size: .82rem; color: var(--muted); }
.node .st { margin-left: auto; font-size: .78rem; font-weight: 800; padding: 4px 10px; border-radius: 999px;
            background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.node.running { border-color: var(--amber); box-shadow: 0 0 0 4px var(--amber-soft); }
.node.running .st { background: var(--amber-soft); color: var(--amber); }
.node.running .ic { animation: bob 1.1s ease-in-out infinite; }
.node.done { border-color: var(--green); } .node.done .st { background: var(--green-soft); color: var(--green); }
.node.error { border-color: var(--red); } .node.error .st { background: var(--red-soft); color: var(--red); }
@keyframes bob { 50% { transform: translateY(-4px); } }
.feed { font-size: .85rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; min-height: 20px; }
.feed code { background: var(--surface-2); padding: 1px 6px; border-radius: 6px; }

/* answers */
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 18px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
        overflow: hidden; display: flex; flex-direction: column; }
.card-h { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.card-h .ic { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; font-size: 1.1rem; }
.card-h .t { font-weight: 800; } .card-h .s { font-size: .8rem; color: var(--muted); }
.card.who .card-h .ic { background: var(--blue-soft); } .card.web .card-h .ic { background: var(--violet-soft); }
.copy { margin-left: auto; border: 1px solid var(--border); background: none; border-radius: 10px; padding: 5px 10px;
        cursor: pointer; font-size: .8rem; font-weight: 700; color: var(--muted); }
.md { padding: 6px 18px 16px; line-height: 1.6; font-size: .97rem; overflow-wrap: anywhere; }
.md h1, .md h2, .md h3, .md h4 { font-size: 1.02rem; margin: 14px 0 4px; }
.md ul, .md ol { padding-left: 1.3em; } .md li { margin: 3px 0; }
.md code { background: var(--surface-2); padding: 1px 5px; border-radius: 6px; }
.sources { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 18px 16px; margin-top: auto; }
.sources a { text-decoration: none; font-size: .78rem; font-weight: 700; padding: 4px 10px; border-radius: 999px;
             background: var(--violet-soft); color: var(--violet); }
.skeleton { padding: 18px; display: grid; gap: 10px; }
.skeleton i { display: block; height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--surface-2), var(--border), var(--surface-2));
              background-size: 200% 100%; animation: shimmer 1.3s infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }

.metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
.metric { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 12px 16px;
          display: flex; align-items: center; gap: 12px; }
.metric .v { font-size: 1.35rem; font-weight: 800; } .metric .l { font-size: .78rem; color: var(--muted); }
.ring { --p: 0; width: 46px; height: 46px; border-radius: 50%; flex: none; display: grid; place-items: center;
        background: conic-gradient(var(--c, var(--green)) calc(var(--p) * 1%), var(--surface-2) 0); }
.ring::before { content: ""; width: 34px; height: 34px; border-radius: 50%; background: var(--surface); grid-area: 1/1; }
.ring b { grid-area: 1/1; font-size: .72rem; z-index: 1; }
.note { margin-top: 14px; padding: 12px 16px; border-radius: 14px; font-size: .9rem; display: flex; gap: 10px; align-items: center; }
.note.warn { background: var(--amber-soft); } .note.ok { background: var(--green-soft); }
.note.info { background: var(--surface-2); color: var(--muted); }

/* emergency */
.sos { margin: 26px auto 0; max-width: 760px; border: 2px solid var(--red); background: var(--red-soft);
       border-radius: 24px; padding: 22px 24px; }
.sos h2 { margin: 0 0 6px; color: var(--red); }
.sos a.call { display: inline-block; margin-top: 12px; background: var(--red); color: #fff; text-decoration: none;
              font-weight: 800; padding: 12px 20px; border-radius: 14px; }

/* earlier + journal */
.section-t { font-weight: 800; margin: 34px 0 10px; color: var(--muted); font-size: .9rem; text-transform: uppercase; letter-spacing: .06em; }
.row { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 10px; overflow: hidden; }
.row summary { cursor: pointer; padding: 14px 18px; display: flex; gap: 10px; align-items: center; list-style: none; font-weight: 700; }
.row summary::-webkit-details-marker { display: none; }
.row summary .meta { margin-left: auto; color: var(--muted); font-size: .8rem; font-weight: 600; white-space: nowrap; }
.row .inner { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 12px 12px; }
.row .inner > div { background: var(--surface-2); border-radius: 12px; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 26px 0 14px; }
.search { flex: 1; min-width: 220px; border: 1px solid var(--border); background: var(--surface); border-radius: 14px; padding: 11px 14px; }
.btn { border: 1px solid var(--border); background: var(--surface); border-radius: 14px; padding: 10px 16px; font-weight: 800; cursor: pointer; }
.btn.primary { border: 0; color: #fff; background: linear-gradient(135deg, var(--pink), var(--violet)); }
.empty { text-align: center; color: var(--muted); padding: 50px 0; }

/* settings drawer */
.scrim { position: fixed; inset: 0; background: rgba(20,10,30,.35); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100%); background: var(--surface); z-index: 50;
          box-shadow: -10px 0 40px rgba(0,0,0,.15); padding: 22px; overflow-y: auto; }
.drawer h3 { margin: 22px 0 10px; font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.field { display: grid; gap: 6px; margin-bottom: 12px; font-size: .9rem; font-weight: 700; }
.field input, .field select { border: 1px solid var(--border); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.field input[type=range] { padding: 0; accent-color: var(--violet); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; font-size: .9rem; font-weight: 700; }
.switch input { width: 42px; height: 24px; accent-color: var(--violet); }
.src-row { display: flex; gap: 8px; align-items: flex-start; font-size: .85rem; margin-bottom: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; flex: none; }
.dot.live { background: var(--green); } .dot.snapshot { background: var(--blue); } .dot.unavailable { background: var(--red); }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
         padding: 10px 18px; border-radius: 999px; font-weight: 700; z-index: 60; box-shadow: var(--shadow); }
.footer { text-align: center; color: var(--muted); font-size: .82rem; margin-top: 40px; }

@media (max-width: 820px) {
  .pipeline, .answers, .row .inner { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: 1fr 1fr; }
  .tabs .tab span { display: none; }
  .chip-btn .lbl { display: none; }
}
@media (max-width: 480px) {
  .top .wrap { gap: 8px; }
  .logo-text { display: none; }
  .tabs { margin-left: 0; }
  .tab { padding: 7px 12px; }
  .toast { white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

/* ---------- helpers ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("pp_" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("pp_" + k, JSON.stringify(v)); } catch {} },
};
const md = (text) => ({ __html: DOMPurify.sanitize(marked.parse(text || "")) });

/** POST and read the Server-Sent Events stream line by line. */
async function streamAsk(body, onEvent) {
  const res = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!res.ok || !res.body) throw new Error(`Server error ${res.status}`);
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const parts = buffer.split("\n\n");
    buffer = parts.pop();
    for (const part of parts) {
      const line = part.split("\n").find((l) => l.startsWith("data: "));
      if (line) onEvent(JSON.parse(line.slice(6)));
    }
  }
}

/* ---------- small components ---------- */
function Pipeline({ agents, stages }) {
  const label = { waiting: "Waiting", running: "Working…", done: "Done", error: "Error" };
  return (
    <div className="pipeline">
      {agents.map((a, i) => {
        const s = stages[i] || { state: "waiting" };
        return (
          <div key={a.name} className={`node ${s.state}`}>
            <div className="ic">{a.icon}</div>
            <div><div className="nm">{i + 1}. {a.name}</div><div className="ds">{a.desc}</div></div>
            <div className="st">{label[s.state]}{s.seconds != null ? ` · ${s.seconds}s` : ""}</div>
          </div>
        );
      })}
    </div>
  );
}

function AnswerCard({ kind, text, sources, loading, onCopy }) {
  const who = kind === "who";
  return (
    <div className={`card ${kind}`}>
      <div className="card-h">
        <div className="ic">{who ? "🧠" : "🌐"}</div>
        <div>
          <div className="t">{who ? "WHO knowledge" : "Trusted web sources"}</div>
          <div className="s">{who ? "Assistant · answers from who.int" : "Web Search Assistant · fresh results"}</div>
        </div>
        {text && <button className="copy" onClick={() => onCopy(text)}>Copy</button>}
      </div>
      {loading && !text ? (
        <div className="skeleton"><i style={{ width: "90%" }} /><i style={{ width: "75%" }} /><i style={{ width: "82%" }} /><i style={{ width: "60%" }} /></div>
      ) : (
        <div className="md" dangerouslySetInnerHTML={md(text)} />
      )}
      {sources && sources.length > 0 && (
        <div className="sources">
          {sources.map((s) => <a key={s.url} href={s.url} target="_blank" rel="noreferrer">🔗 {s.domain}</a>)}
        </div>
      )}
    </div>
  );
}

function Metrics({ r }) {
  const agreeColor = r.agreement >= 40 ? "var(--green)" : r.agreement >= 20 ? "var(--amber)" : "var(--red)";
  const tokTitle = r.cached ? `Served from cache. Original run: ${r.tokens ?? "?"} tokens`
    : `Prompt ${r.prompt_tokens ?? "?"} · Completion ${r.completion_tokens ?? "?"} · LLM calls ${r.llm_calls ?? "?"}`;
  return (
    <div className="metrics">
      <div className="metric"><div style={{ fontSize: "1.5rem" }}>⏱</div><div><div className="v">{r.elapsed}s</div><div className="l">Total time</div></div></div>
      <div className="metric" title={tokTitle}><div style={{ fontSize: "1.5rem" }}>{r.cached ? "⚡" : "🔢"}</div>
        <div><div className="v">{r.cached ? "0" : (r.tokens ?? "—").toLocaleString()}</div><div className="l">{r.cached ? "Tokens · cached" : "Tokens used"}</div></div></div>
      <div className="metric" title="How similar the two answers are. Low means double-check.">
        <div className="ring" style={{ "--p": r.agreement, "--c": agreeColor }}><b>{r.agreement}%</b></div>
        <div><div className="v" style={{ fontSize: "1rem" }}>{r.agreement >= 40 ? "Agree" : r.agreement >= 20 ? "Partly agree" : "Differ"}</div><div className="l">Answer agreement</div></div></div>
      <div className="metric"><div style={{ fontSize: "1.5rem" }}>🔗</div><div><div className="v">{r.sources.length}</div><div className="l">Web sources</div></div></div>
    </div>
  );
}

function Emergency({ e }) {
  const first = (e.number.match(/\d+/) || [""])[0];
  return (
    <div className="sos" role="alert">
      <h2>🚨 This may be an emergency</h2>
      <div><b>Call {e.number} now</b>, or go to the nearest hospital. Don't wait for an online answer.</div>
      <div style={{ marginTop: 8, color: "var(--muted)" }}>Stay with your child, keep them safe, and take any medicine or packaging with you.</div>
      {first && <a className="call" href={`tel:${first}`}>📞 Call {first}</a>}
    </div>
  );
}

function Settings({ cfg, s, set, onClose, onRefresh }) {
  return (
    <>
      <div className="scrim" onClick={onClose} />
      <aside className="drawer">
        <div style={{ display: "flex", alignItems: "center" }}>
          <b style={{ fontSize: "1.2rem" }}>Settings</b><div className="spacer" />
          <button className="icon-btn" onClick={onClose} aria-label="Close">✕</button>
        </div>
        <h3>👶 About your child</h3>
        <label className="field">Name (optional)<input value={s.name} placeholder="e.g. Aarav" onChange={(e) => set({ name: e.target.value })} /></label>
        <label className="field">Age<select value={s.age} onChange={(e) => set({ age: e.target.value })}>{cfg.ages.map((a) => <option key={a}>{a}</option>)}</select></label>
        <label className="field">Country<select value={s.country} onChange={(e) => set({ country: e.target.value })}>{cfg.countries.map((c) => <option key={c}>{c}</option>)}</select></label>

        <h3>⚙️ AI settings</h3>
        <label className="field">Model<select value={s.model} onChange={(e) => set({ model: e.target.value })}>{cfg.models.map((m) => <option key={m}>{m}</option>)}</select></label>
        <label className="field">Creativity · {s.temperature}<input type="range" min="0" max="1" step="0.1" value={s.temperature} onChange={(e) => set({ temperature: +e.target.value })} /></label>
        <label className="field">Web results to read · {s.n_results}<input type="range" min="1" max="8" value={s.n_results} onChange={(e) => set({ n_results: +e.target.value })} /></label>
        <label className="switch">⚡ Reuse answers for repeated questions<input type="checkbox" checked={s.use_cache} onChange={(e) => set({ use_cache: e.target.checked })} /></label>
        <label className="switch">Fetch all WHO pages live<input type="checkbox" checked={s.live_all} onChange={(e) => set({ live_all: e.target.checked })} /></label>

        <h3>📚 Assistant knowledge (WHO)</h3>
        {cfg.sources.map((src) => (
          <div className="src-row" key={src.url}><span className={`dot ${src.mode}`} />
            <div><a href={src.url} target="_blank" rel="noreferrer">{src.title}</a>
              <div style={{ color: "var(--muted)", fontSize: ".75rem" }}>{src.mode}{src.mode === "snapshot" ? ` · ${cfg.snapshot_date}` : ""}</div></div></div>
        ))}
        <button className="btn" onClick={onRefresh} style={{ marginTop: 6 }}>🔄 Refresh WHO pages</button>

        <h3>🔑 API keys</h3>
        {Object.entries(cfg.keys).map(([k, ok]) => <div key={k} style={{ fontSize: ".88rem", marginBottom: 6 }}>{ok ? "✅" : "❌"} <code>{k}</code> {ok ? "loaded from environment" : "missing - add it to .env"}</div>)}
      </aside>
    </>
  );
}

function Journal({ name, onToast }) {
  const [entries, setEntries] = useState(null);
  const [q, setQ] = useState("");
  useEffect(() => { fetch("/api/journal").then((r) => r.json()).then(setEntries).catch(() => setEntries([])); }, []);
  if (entries === null) return <div className="empty">Loading your journal…</div>;
  const shown = entries.filter((e) => (e.query + e.a1 + e.a2).toLowerCase().includes(q.toLowerCase()));
  return (
    <>
      <div className="toolbar">
        <input className="search" placeholder="🔎 Search your journal - e.g. sleep, vaccine, fever" value={q} onChange={(e) => setQ(e.target.value)} />
        {entries.length > 0 && (
          <a className="btn primary" style={{ textDecoration: "none" }} href={`/api/visit-sheet?name=${encodeURIComponent(name)}`}
             onClick={() => onToast("Doctor-visit sheet downloaded")}>🩺 Prepare for my doctor visit</a>
        )}
      </div>
      <div style={{ color: "var(--muted)", marginBottom: 12 }}>{entries.length} question(s) saved by the Entry Agent</div>
      {shown.map((e, i) => (
        <details className="row" key={i}>
          <summary>💬 {e.query}<span className="meta">{e.time} · {e.age}</span></summary>
          <div className="inner">
            <div><div className="md" dangerouslySetInnerHTML={md("**🧠 WHO knowledge**\n\n" + e.a1)} /></div>
            <div><div className="md" dangerouslySetInnerHTML={md("**🌐 Web sources**\n\n" + e.a2)} /></div>
          </div>
        </details>
      ))}
      {entries.length === 0 && <div className="empty">📔 Your journal is empty - every question you ask is saved here automatically.</div>}
    </>
  );
}

/* ---------- app ---------- */
function App() {
  const [cfg, setCfg] = useState(null);
  const [cfgError, setCfgError] = useState("");
  const [tab, setTab] = useState("ask");
  const [showSettings, setShowSettings] = useState(false);
  const [theme, setTheme] = useState(store.get("theme", null));
  const [s, setS] = useState(() => store.get("settings", {
    name: "", age: "7-11 months", country: "India", model: "gpt-4o-mini",
    temperature: 0.3, n_results: 3, use_cache: true, live_all: false,
  }));
  const [query, setQuery] = useState("");
  const [busy, setBusy] = useState(false);
  const [stages, setStages] = useState([]);
  const [feed, setFeed] = useState([]);
  const [current, setCurrent] = useState(null);   // {query, result?, emergency?, error?}
  const [history, setHistory] = useState([]);
  const [toast, setToast] = useState("");
  const taRef = useRef(null);

  const set = (patch) => setS((prev) => { const next = { ...prev, ...patch }; store.set("settings", next); return next; });
  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2200); };

  useEffect(() => {
    fetch("/api/config").then((r) => r.json()).then(setCfg)
      .catch(() => setCfgError("Can't reach the ParentPal server. Start it with: python3 server.py"));
  }, []);
  useEffect(() => {
    if (theme) document.documentElement.setAttribute("data-theme", theme);
    else document.documentElement.removeAttribute("data-theme");
    store.set("theme", theme);
  }, [theme]);
  useEffect(() => {  // auto-grow the question box
    const ta = taRef.current; if (!ta) return;
    ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 160) + "px";
  }, [query]);

  async function ask(text) {
    const q = (text ?? query).trim();
    if (!q || busy) return;
    setQuery(q); setBusy(true); setFeed([]); setStages([]);
    if (current?.result) setHistory((h) => [current, ...h].slice(0, 10));
    setCurrent({ query: q, age: s.age });
    try {
      await streamAsk({ ...s, query: q }, (ev) => {
        if (ev.type === "stage") {
          setStages((prev) => { const n = [...prev]; n[ev.agent] = { state: ev.state, seconds: ev.seconds }; return n; });
          if (ev.state === "running") setFeed((f) => [...f, `▶️ ${cfg.agents[ev.agent].name} started`]);
        } else if (ev.type === "tool") {
          setFeed((f) => [...f, `🔧 ${ev.tool}: ${ev.input}`]);
        } else if (ev.type === "result") {
          setStages((prev) => [0, 1, 2].map((i) => ({ ...(prev[i] || {}), state: "done" })));
          setCurrent({ query: q, age: s.age, result: ev });
          showToast(ev.cached ? "⚡ Answered from cache - 0 tokens" : "💗 Both answers ready - saved to your journal");
        } else if (ev.type === "emergency") {
          setCurrent({ query: q, emergency: ev });
        } else if (ev.type === "error") {
          setStages((prev) => prev.map((st) => (st && st.state === "running" ? { ...st, state: "error" } : st)));
          setCurrent({ query: q, error: ev.message });
        }
      });
    } catch (err) {
      setCurrent({ query: q, error: String(err.message || err) });
    } finally {
      setBusy(false);
    }
  }
  if (cfgError) return <div className="wrap"><div className="sos" style={{ marginTop: 60 }}><h2>Server not running</h2>{cfgError}</div></div>;
  if (!cfg) return <div className="empty">Loading ParentPal…</div>;

  const child = s.name.trim() || "your little one";
  const r = current?.result;
  const keysMissing = Object.values(cfg.keys).some((v) => !v);

  return (
    <>
      <header className="top">
        <div className="wrap">
          <div className="logo"><div className="logo-mark">👶</div><span className="logo-text">ParentPal</span></div>
          <nav className="tabs">
            <button className={`tab ${tab === "ask" ? "on" : ""}`} onClick={() => setTab("ask")}>💬 <span>Ask</span></button>
            <button className={`tab ${tab === "journal" ? "on" : ""}`} onClick={() => setTab("journal")}>📔 <span>Baby journal</span></button>
          </nav>
          <div className="spacer" />
          <button className="chip-btn" onClick={() => setShowSettings(true)} title="Child & settings">
            <span className="av">🧸</span><span className="lbl">{s.name || "Child"} · {s.age}</span>
          </button>
          <button className="icon-btn" title="Toggle theme"
                  onClick={() => setTheme(theme === "dark" ? "light" : theme === "light" ? null : "dark")}>
            {theme === "dark" ? "🌙" : theme === "light" ? "☀️" : "🌗"}
          </button>
        </div>
      </header>

      <main className="wrap">
        {tab === "journal" ? <Journal name={s.name} onToast={showToast} /> : (
          <>
            <section className="hero">
              <h1>Hi! What's on your mind about <span>{child}</span>?</h1>
              <p>WHO guidance and trusted web sources, side by side - saved to your baby journal.</p>
              <div className="ask">
                <textarea ref={taRef} rows={1} value={query} placeholder="e.g. When can my baby start eating eggs?"
                          onChange={(e) => setQuery(e.target.value)}
                          onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); } }} />
                <button className="send" disabled={busy || !query.trim()} onClick={() => ask()}>{busy ? "Thinking…" : "Ask 💗"}</button>
              </div>
              <div className="samples">
                {cfg.samples.map((q) => <button key={q} className="sample" disabled={busy} onClick={() => ask(q)}>{q}</button>)}
              </div>
              <div className="context-line">Answers are tailored for <b>{s.age}</b> · {s.country} ·{" "}
                <a href="#" onClick={(e) => { e.preventDefault(); setShowSettings(true); }}>change</a></div>
              {keysMissing && <div className="note warn" style={{ maxWidth: 760, margin: "14px auto 0" }}>🔑 An API key is missing - add it to your <code>.env</code> file and restart the server.</div>}
            </section>

            {current?.emergency && <Emergency e={current.emergency} />}

            {current && !current.emergency && (
              <>
                <Pipeline agents={cfg.agents} stages={stages} />
                {busy && <div className="feed">{feed.slice(-5).map((f, i) => <span key={i}>{f}</span>)}</div>}
                {current.error && <div className="note warn">⚠️ {current.error}</div>}
                {!current.error && (
                  <>
                    <h2 style={{ margin: "22px 0 0", fontSize: "1.25rem" }}>💬 {current.query}</h2>
                    <div className="answers">
                      <AnswerCard kind="who" text={r?.a1} loading={busy} onCopy={(t) => { navigator.clipboard?.writeText(t); showToast("Copied"); }} />
                      <AnswerCard kind="web" text={r?.a2} sources={r?.sources} loading={busy} onCopy={(t) => { navigator.clipboard?.writeText(t); showToast("Copied"); }} />
                    </div>
                  </>
                )}
                {r && (
                  <>
                    <Metrics r={r} />
                    {r.agreement < 20 && <div className="note warn">🤔 The two answers differ quite a bit - worth checking with your paediatrician.</div>}
                    <div className="note ok">📔 Entry Agent {r.cached ? "already saved this in" : "saved this to"} your baby journal · <code>{r.saved_to.split("/").pop()}</code></div>
                    <div className="note info">💗 ParentPal shares general information, not medical advice. Always follow your paediatrician's guidance.</div>
                  </>
                )}
              </>
            )}

            {history.length > 0 && (
              <>
                <div className="section-t">Earlier in this session</div>
                {history.map((h, i) => (
                  <details className="row" key={i}>
                    <summary>💬 {h.query}<span className="meta">{h.result.time} · {h.age}</span></summary>
                    <div className="inner">
                      <div><div className="md" dangerouslySetInnerHTML={md("**🧠 WHO knowledge**\n\n" + h.result.a1)} /></div>
                      <div><div className="md" dangerouslySetInnerHTML={md("**🌐 Web sources**\n\n" + h.result.a2)} /></div>
                    </div>
                  </details>
                ))}
              </>
            )}
          </>
        )}
        <div className="footer">ParentPal · 3 CrewAI agents in sequence: Assistant (WHO) → Web Search Assistant → Entry Agent</div>
      </main>

      {showSettings && (
        <Settings cfg={cfg} s={s} set={set} onClose={() => setShowSettings(false)}
                  onRefresh={async () => {
                    const sources = await fetch("/api/kb/refresh", { method: "POST" }).then((x) => x.json());
                    setCfg((c) => ({ ...c, sources })); showToast("WHO pages refreshed");
                  }} />
      )}
      {toast && <div className="toast">{toast}</div>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
